name = "cf-demo-app"
account_id = "5efa272dc28e4e3933324c44165b6dbe"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Workers AI + AI Gateway
[ai]
binding = "AI"

# R2 - Crawler data storage (for AI Search / AutoRAG indexing)
[[r2_buckets]]
binding = "CRAWLER_BUCKET"
bucket_name = "cf-demo-crawler"

# KV Namespace - Sessions
[[kv_namespaces]]
binding = "KV"
id = "cd03af00eb9340a180014760028fbebd"

# Dynamic Workers (open beta) — spins up V8 isolates at runtime for the
# executeJs chat tool. Isolate-level sandboxing, ms startup, JS only;
# complements the container-based Python sandbox (workers/chat-sandbox).
[[worker_loaders]]
binding = "LOADER"

# Secrets (set via wrangler secret put):
# - CHAT_SANDBOX_URL: https://chat-sandbox.neokung.work — MUST be the custom domain,
#   not workers.dev; exposePort derives preview-URL hostnames from the request host.
# - CHAT_SANDBOX_SECRET: shared secret, same value as SANDBOX_API_SECRET on cf-chat-sandbox
[vars]
CF_ACCOUNT_ID = "5efa272dc28e4e3933324c44165b6dbe"
AI_GATEWAY_ID = "nkcf-gateway-01"
AUTORAG_NAME = "cf-demo-ai-search"
MCP_SERVER_URLS = "cf-docs=https://docs.mcp.cloudflare.com/mcp,cf-observability=https://observability.mcp.cloudflare.com/mcp:oauth,cf-radar=https://radar.mcp.cloudflare.com/mcp:oauth,sap=https://sap-mcp.neokung.work/mcp:oauth,salesforce=https://salesforce-mcp.neokung.work/mcp:oauth"