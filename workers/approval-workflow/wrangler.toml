# Human-in-the-loop approval Workflow for the demo app's MCP writes
# (docs/superpowers/specs/2026-10-26-human-in-the-loop-approvals-design.md).
# Deploy: npx wrangler deploy -c workers/approval-workflow/wrangler.toml (from the repo root)
name = "cf-approval-workflow"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "5efa272dc28e4e3933324c44165b6dbe"
workers_dev = true

[observability]
enabled = true

  [observability.traces]
  enabled = true
  head_sampling_rate = 1

[[workflows]]
name = "approval-workflow"
binding = "APPROVAL_WORKFLOW"
class_name = "ApprovalWorkflow"

# Same D1 as the app (table `approvals`, migrations/chat-history/0003_approvals.sql).
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "cf-demo-chat-history"
database_id = "82dfa424-a91f-4794-9991-a5f2daf83172"

# Email to the approvers through Cloudflare Email Sending. The sender domain
# (mail.neokung.work) must be onboarded in Email Service > Email Sending; only
# the subdomain gets DNS records, the apex (neokung.work) is untouched.
[[send_email]]
name = "APPROVAL_EMAIL"
allowed_destination_addresses = ["neo@cloudflare.com", "neoray12@hotmail.com"]

[vars]
APP_URL = "https://demo.neokung.work"
MAIL_FROM = "approvals@mail.neokung.work"
# Comma-separated; every address must be in allowed_destination_addresses above.
APPROVER_EMAIL = "neo@cloudflare.com, neoray12@hotmail.com"

# Secret (wrangler secret put APPROVAL_SECRET -c workers/approval-workflow/wrangler.toml):
# - APPROVAL_SECRET: same value as the app's APPROVAL_SECRET
