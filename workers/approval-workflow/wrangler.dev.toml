# Local dev: run from the repo root so the Workflow shares the app's local D1:
#   npx wrangler dev -c workers/approval-workflow/wrangler.dev.toml --persist-to .wrangler/state --port 8790
name = "cf-approval-workflow"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[workflows]]
name = "approval-workflow"
binding = "APPROVAL_WORKFLOW"
class_name = "ApprovalWorkflow"

[[d1_databases]]
binding = "HISTORY_DB"
database_name = "cf-demo-chat-history"
database_id = "82dfa424-a91f-4794-9991-a5f2daf83172"

[vars]
APP_URL = "http://localhost:3000"
MAIL_FROM = "approvals@neokung.work"
# Only used to decide who may approve by replying (no send_email binding
# locally, so nothing is sent). Simulate a reply with:
#   curl -X POST 'http://localhost:8790/cdn-cgi/local/email' --url-query 'from=neo@cloudflare.com' \
#     --url-query 'to=<the approval's reply address>' --data-binary @reply.eml
APPROVER_EMAIL = "neo@cloudflare.com"
REPLY_DOMAIN = "mail.neokung.work"
# No email locally: the approval link and reply address (and reply
# confirmations) are printed to the worker log instead.
LOG_APPROVAL_LINK = "1"
