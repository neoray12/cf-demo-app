name = "cf-chat-sandbox"
account_id = "5efa272dc28e4e3933324c44165b6dbe"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# Two routes required — the wildcard does NOT match the apex:
#   apex:     chat-sandbox.neokung.work            → API (called by cf-demo-app)
#   wildcard: 8000-sbx-xxx-token.chat-sandbox...   → exposePort preview URLs
# DNS prerequisites (dashboard, both proxied):
#   chat-sandbox    CNAME → cf-chat-sandbox.neo-cloudflare.workers.dev
#   *.chat-sandbox  CNAME → cf-chat-sandbox.neo-cloudflare.workers.dev
# TLS: two-level subdomains need ACM/Total TLS on the zone (already in place
# for *.saas-cfclaw.neokung.work).
[[routes]]
pattern = "chat-sandbox.neokung.work/*"
zone_name = "neokung.work"

[[routes]]
pattern = "*.chat-sandbox.neokung.work/*"
zone_name = "neokung.work"

[observability]
enabled = true

# Container configuration for chat code-interpreter sandboxes
# Pinned to APAC: our demo traffic originates from Taipei, and without a
# constraint, Containers schedules to "nearest region with a pre-fetched
# image" — which defaulted to ENAM (Chicago) since that's where this image
# was first deployed/warmed, not the geographically nearest region.
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 5

  [containers.constraints]
  regions = [ "APAC" ]

[durable_objects]
bindings = [
  { class_name = "Sandbox", name = "Sandbox" }
]

[[migrations]]
new_sqlite_classes = ["Sandbox"]
tag = "v1"

# Shared with cf-demo-app's KV namespace — keys are prefixed "chat-sandbox:"
# to stay out of the main app's keyspace. Used to pin each session's resolved
# sandbox ID after colo-avoidance re-rolls (see AVOID_COLOS).
[[kv_namespaces]]
binding = "KV"
id = "cd03af00eb9340a180014760028fbebd"

[vars]
SANDBOX_LOG_LEVEL = "info"
# Comma-separated colo IATA codes the sandbox must NOT run in. Containers
# placement only supports region granularity (APAC etc.), so city-level
# avoidance is done app-side: probe the container's colo on first use and
# destroy + re-roll with a generation suffix if it landed somewhere here.
AVOID_COLOS = "HKG"

# Secrets (set via wrangler secret put):
# - SANDBOX_API_SECRET: shared secret for authenticating requests from cf-demo-app
